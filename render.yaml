services:
  - type: web
    name: reto-03-sap-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: auto
      - key: GEMINI_THINKING_LEVEL
        value: low
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: "2048"
      - key: GEMINI_API_KEY
        sync: false
      - key: MAX_ITERACIONES_TOOL
        value: "25"
      - key: MAX_HERRAMIENTAS_POR_TURNO
        value: "12"
      - key: MAX_TOKENS_SESION
        value: "60000"
      - key: MAX_TOKENS_SALIDA
        value: "2048"
      - key: MAX_TOKENS_DIA
        value: "200000"
      - key: MAX_CONCURRENT_CHATS
        value: "4"
      - key: TRUST_PROXY
        value: "1"

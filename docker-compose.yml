services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      TRUST_PROXY: "1"
      LLM_PROVIDER: "${LLM_PROVIDER:-gemini}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-auto}"
      GEMINI_THINKING_LEVEL: "${GEMINI_THINKING_LEVEL:-low}"
      GEMINI_MAX_OUTPUT_TOKENS: "${GEMINI_MAX_OUTPUT_TOKENS:-2048}"
      MAX_ITERACIONES_TOOL: "${MAX_ITERACIONES_TOOL:-25}"
      MAX_HERRAMIENTAS_POR_TURNO: "${MAX_HERRAMIENTAS_POR_TURNO:-12}"
      MAX_TOKENS_SESION: "${MAX_TOKENS_SESION:-60000}"
      MAX_TOKENS_SALIDA: "${MAX_TOKENS_SALIDA:-2048}"
      MAX_TOKENS_DIA: "${MAX_TOKENS_DIA:-200000}"
      MAX_CONCURRENT_CHATS: "${MAX_CONCURRENT_CHATS:-4}"
      OUT_DIR: "${OUT_DIR:-}"
      APP_ORIGINS: "${APP_ORIGINS:-}"
      TRUST_PROXY: "1"
    volumes:
      - reto03-out:/app/out
    restart: unless-stopped

volumes:
  reto03-out:
